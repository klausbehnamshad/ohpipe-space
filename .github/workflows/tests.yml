name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python eval/run_gates.py --split dev
      - run: python eval/spec_freeze.py
      - run: pip install -r requirements-ci.txt
      - run: OHPIPE_SPACE_MODE=fixture python -B -m unittest discover -s app -t app -p 'test_*.py'
      - run: python -B app/check_precomputed.py
      - run: bash eval/space_check.sh
